<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSim - AI Interview Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="brand">
            <h1>HireSim</h1>
            <p>AI-Powered IT Interview Practice</p>
        </div>

        <div class="form-box">

            <div class="tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="registerTab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <h2>Welcome Back</h2>
                <p class="subtitle">Login to continue your interview practice</p>

                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="submit-btn">
                    Login
                </button>

                <p id="loginMessage" class="message"></p>

            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden">

                <h2>Create Account</h2>
                <p class="subtitle">Start your IT interview practice journey</p>

                <label>Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <button type="submit" class="submit-btn">
                    Create Account
                </button>

                <p id="registerMessage" class="message"></p>

            </form>

        </div>

        <p class="footer">
            Practice interviews. Improve skills. Get interview-ready.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
