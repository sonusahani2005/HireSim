<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireSim - Technical Round</title>

    <link rel="stylesheet" href="technical.css">
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="top-bar">

        <div class="logo">
            HireSim
        </div>

        <div class="round-name">
            Technical Round
        </div>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <main class="container">

        <!-- Progress -->

        <div class="progress-section">

            <div class="progress-text">
                Question
                <span id="questionNumber">1</span>
                of
                <span id="totalQuestions">25</span>
            </div>

            <div class="progress-text">
                Technical
            </div>

        </div>


        <!-- Progress Bar -->

        <div class="progress-bar-container">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <!-- Timer -->

        <div class="timer-box">

            ⏱️ Time Left:

            <strong id="timer">
                30:00
            </strong>

        </div>


        <!-- Question Card -->

        <div class="question-card">

            <div
                class="question-title"
                id="questionTitle">
            </div>

            <div
                class="question-text"
                id="questionText">
            </div>


            <!-- Options -->

            <div
                class="options"
                id="optionsContainer">
            </div>


            <!-- Navigation -->

            <div class="navigation-buttons">

                <button
                    id="previousButton"
                    onclick="previousQuestion()">

                    ← Previous

                </button>


                <button
                    id="nextButton"
                    onclick="nextQuestion()">

                    Next →

                </button>

            </div>

        </div>

    </main>


    <script>

        // =========================
        // API
        // =========================

        const API_URL =
           "https://hiresim.onrender.com/questions/technical"


        // =========================
        // VARIABLES
        // =========================

        let questions = [];

        let currentQuestion = 0;

        let totalSeconds = 30 * 60;

        let timer = null;

        let answers = [];

        let submitted = false;


        // =========================
        // LOAD QUESTIONS
        // =========================

        async function loadQuestions() {

            try {

                const response =
                    await fetch(API_URL);

                if (!response.ok) {

                    throw new Error(
                        "Failed to load technical questions"
                    );

                }

                questions =
                    await response.json();


                // Shuffle questions

                questions =
                    questions.sort(
                        () => Math.random() - 0.5
                    );


                // Keep maximum 25

                questions =
                    questions.slice(0, 25);


                if (questions.length === 0) {

                    document.querySelector(
                        ".question-card"
                    ).innerHTML = `

                        <h2>
                            No technical questions found.
                        </h2>

                    `;

                    return;
                }


                // Create answer array

                answers =
                    new Array(
                        questions.length
                    ).fill(null);


                document.getElementById(
                    "totalQuestions"
                ).textContent =
                    questions.length;


                showQuestion();

                startTimer();

            }

            catch (error) {

                console.error(error);

                document.querySelector(
                    ".question-card"
                ).innerHTML = `

                    <h2>
                        Unable to load questions.
                    </h2>

                    <p>
                        Please make sure the backend
                        is running on port 8080.
                    </p>

                `;

            }

        }


        // =========================
        // SHOW QUESTION
        // =========================

        function showQuestion() {

            if (!questions.length) {
                return;
            }


            const question =
                questions[currentQuestion];


            // Question number

            document.getElementById(
                "questionNumber"
            ).textContent =
                currentQuestion + 1;


            // Question title

            document.getElementById(
                "questionTitle"
            ).textContent =
                `Question ${currentQuestion + 1}`;


            // Question text

            document.getElementById(
                "questionText"
            ).textContent =
                question.questionText;


            // Progress

            const progress =
                ((currentQuestion + 1)
                / questions.length) * 100;


            const progressBar =
                document.getElementById(
                    "progressBar"
                );


            if (progressBar) {

                progressBar.style.width =
                    progress + "%";

            }


            // Options

            const optionsContainer =
                document.getElementById(
                    "optionsContainer"
                );


            optionsContainer.innerHTML = "";


            const options = [

                {
                    value: "A",
                    text: question.optionA
                },

                {
                    value: "B",
                    text: question.optionB
                },

                {
                    value: "C",
                    text: question.optionC
                },

                {
                    value: "D",
                    text: question.optionD
                }

            ];


            options.forEach(
                option => {

                    const label =
                        document.createElement(
                            "label"
                        );


                    label.className =
                        "option";


                    if (
                        answers[currentQuestion]
                        === option.value
                    ) {

                        label.classList.add(
                            "selected"
                        );

                    }


                    label.innerHTML = `

                        <input
                            type="radio"
                            name="answer"
                            value="${option.value}"
                            ${answers[currentQuestion]
                                === option.value
                                ? "checked"
                                : ""}
                        >

                        <span>
                            <strong>
                                ${option.value}.
                            </strong>

                            ${option.text}
                        </span>

                    `;


                    const radio =
                        label.querySelector(
                            "input"
                        );


                    radio.addEventListener(
                        "change",
                        function () {

                            answers[currentQuestion] =
                                this.value;


                            document
                                .querySelectorAll(
                                    ".option"
                                )
                                .forEach(
                                    item =>
                                        item.classList
                                            .remove(
                                                "selected"
                                            )
                                );


                            label.classList.add(
                                "selected"
                            );

                        }
                    );


                    optionsContainer.appendChild(
                        label
                    );

                }
            );


            // Previous button

            const previousButton =
                document.getElementById(
                    "previousButton"
                );


            previousButton.disabled =
                currentQuestion === 0;


            // Next button

            const nextButton =
                document.getElementById(
                    "nextButton"
                );


            if (
                currentQuestion ===
                questions.length - 1
            ) {

                nextButton.textContent =
                    "✓ Submit Technical Test";

            }

            else {

                nextButton.textContent =
                    "Next →";

            }

        }


        // =========================
        // PREVIOUS QUESTION
        // =========================

        function previousQuestion() {

            if (
                currentQuestion > 0
            ) {

                currentQuestion--;

                showQuestion();

            }

        }


        // =========================
        // NEXT QUESTION
        // =========================

        function nextQuestion() {

            if (
                currentQuestion <
                questions.length - 1
            ) {

                currentQuestion++;

                showQuestion();

            }

            else {

                submitTechnicalTest();

            }

        }


        // =========================
        // SUBMIT TEST
        // =========================

        function submitTechnicalTest() {

            if (submitted) {
                return;
            }


            const confirmSubmit =
                confirm(
                    "Are you sure you want to submit the Technical Test?"
                );


            if (!confirmSubmit) {
                return;
            }


            submitted = true;


            clearInterval(timer);


            calculateResult();

        }


        // =========================
        // CALCULATE RESULT
        // =========================

        function calculateResult() {

            let correct = 0;

            let wrong = 0;

            let notAttempted = 0;


            questions.forEach(
                (question, index) => {

                    const userAnswer =
                        answers[index];


                    if (!userAnswer) {

                        notAttempted++;

                    }

                    else if (
                        userAnswer ===
                        question.correctAnswer
                    ) {

                        correct++;

                    }

                    else {

                        wrong++;

                    }

                }
            );


            // =========================
            // SAVE RESULT
            // =========================

            localStorage.setItem(
                "technicalScore",
                correct
            );


            localStorage.setItem(
                "technicalTotal",
                questions.length
            );


            localStorage.setItem(
                "technicalCorrect",
                correct
            );


            localStorage.setItem(
                "technicalWrong",
                wrong
            );


            localStorage.setItem(
                "technicalNotAttempted",
                notAttempted
            );


            // =========================
            // SHOW RESULT
            // =========================

            document.querySelector(
                ".question-card"
            ).innerHTML = `

                <div class="result-icon">
                    🎉
                </div>


                <h1>
                    Technical Round Completed!
                </h1>


                <p class="result-text">
                    Your Result
                </p>


                <div class="result-score">
                    ${correct} / ${questions.length}
                </div>


                <div class="result-item">
                    <strong>Correct:</strong>
                    ${correct}
                </div>


                <div class="result-item">
                    <strong>Wrong:</strong>
                    ${wrong}
                </div>


                <div class="result-item">
                    <strong>Not Attempted:</strong>
                    ${notAttempted}
                </div>


                <button
                    class="coding-button"
                    onclick="goToCoding()">

                    Continue to Coding Round →

                </button>

            `;

        }


        // =========================
        // TIMER
        // =========================

        function startTimer() {

            updateTimer();


            timer =
                setInterval(
                    function () {

                        totalSeconds--;


                        updateTimer();


                        if (
                            totalSeconds <= 0
                        ) {

                            clearInterval(timer);


                            if (!submitted) {

                                submitted = true;

                                calculateResult();

                            }

                        }

                    },
                    1000
                );

        }


        // =========================
        // UPDATE TIMER
        // =========================

        function updateTimer() {

            const minutes =
                Math.floor(
                    totalSeconds / 60
                );


            const seconds =
                totalSeconds % 60;


            const timerElement =
                document.getElementById(
                    "timer"
                );


            if (!timerElement) {
                return;
            }


            timerElement.textContent =

                String(minutes).padStart(
                    2,
                    "0"
                )

                +

                ":"

                +

                String(seconds).padStart(
                    2,
                    "0"
                );


            // Warning

            if (
                totalSeconds <= 300
            ) {

                timerElement.style.color =
                    "#dc3545";

            }

        }


        // =========================
        // GO TO CODING
        // =========================

        function goToCoding() {

            window.location.href =
                "coding.html";

        }


        // =========================
        // START
        // =========================

        loadQuestions();

    </script>

</body>

</html>
